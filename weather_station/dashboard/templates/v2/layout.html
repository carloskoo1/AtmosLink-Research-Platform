<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="AtmosLink Research Platform scientific monitoring interface"
  >

  <title>
    {% block title %}
    AtmosLink Research Platform
    {% endblock %}
  </title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='v2/css/base.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='v2/css/layout.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='v2/css/components.css') }}"
  >

  {% block styles %}{% endblock %}
  <link rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b4f82'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='white'%3EA%3C/text%3E%3C/svg%3E">
</head>

<body>
  <div class="atl-app">

    <aside class="atl-sidebar">
      <nav aria-label="Navegación principal">
        {% block navigation %}{% endblock %}
      </nav>
    </aside>

    <header class="atl-topbar">
      {% block topbar %}

      <div class="atl-topbar__context">
        <div class="atl-topbar__title">
          AtmosLink Research Platform
        </div>

        <div
          id="topbarStation"
          class="atl-topbar__subtitle"
        >
          Cargando estación…
        </div>
      </div>

      <div class="atl-topbar__actions">
        <span class="atl-live">
          Plataforma conectada
        </span>

        <span class="atl-chip">
          UI v2
        </span>
      </div>

      {% endblock %}
    </header>

    <main class="atl-main">
      <div class="atl-main__inner">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
